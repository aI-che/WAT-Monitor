services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - TZ=Europe/Istanbul
      - GENERIC_TIMEZONE=Europe/Istanbul
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
